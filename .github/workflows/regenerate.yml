name: regenerate

# Self-contained: validates freshness and re-renders the README from the committed
# dataset. It does NOT need the private site source — new prices arrive when the
# owner runs `npm run export` against the site content and pushes data/pricing.json.
on:
  push:
    paths:
      - 'data/pricing.json'
      - 'data/graveyard.json'
      - 'data/price-changes.json'
      - 'scripts/render-readme.mjs'
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC — freshness gate runs even if nothing was pushed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate shape + freshness (fails if any price is stale)
        run: node scripts/validate.mjs
      - name: Re-render README from the dataset
        run: node scripts/render-readme.mjs
      - name: Commit refreshed README (if changed)
        run: |
          git config user.name  "aitrendtool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: re-render README from dataset"
          git push
